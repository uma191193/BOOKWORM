# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080
server.address=127.0.0.1

# ── Application ───────────────────────────────────────────────────────────────
spring.application.name=bookworm

# ── DataSource — H2 in-memory ─────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:bookworm;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Defer datasource init so Hibernate creates the schema BEFORE Spring runs SQL scripts
spring.jpa.defer-datasource-initialization=true

# ── SQL Initialisation — auto-seed on startup ─────────────────────────────────
# Spring executes sample-data.sql after Hibernate has created the schema.
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:sample-data.sql

# ── H2 Console (dev only — disable in production) ────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JWT ───────────────────────────────────────────────────────────────────────
# Override JWT_SECRET with a strong env-var secret in production.
# The default below is for local development only — never use it in production.
bookworm.jwt.secret=${JWT_SECRET:dev-local-secret-key-min-32-bytes!!}
bookworm.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ── OpenAPI / Swagger UI ──────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.bookworm=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
